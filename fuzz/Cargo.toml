[package]
name = "touchstone-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
touchstone-core = { path = "../crates/touchstone-core" }
