[package]
name = "touchstone-cli"
description = "The touchstone binary: run the conformance battery, sign and verify attestations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "conformance", "attestation", "agi", "audit"]
categories = ["command-line-utilities", "development-tools::testing"]
readme = "../../README.md"

[[bin]]
name = "touchstone"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
touchstone-core = { path = "../touchstone-core", version = "0.1.0" }
touchstone-harness = { path = "../touchstone-harness", version = "0.1.0" }
touchstone-identity = { path = "../touchstone-identity", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
