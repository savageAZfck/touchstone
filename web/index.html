<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>touchstone — verify, don't trust</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, monospace; background: #0b0b0f; color: #e8e8ec; max-width: 760px; margin: 4rem auto; padding: 0 1.5rem; }
  h1 { font-size: 1.6rem; letter-spacing: -0.02em; }
  .sub { color: #8888a0; margin-bottom: 2rem; }
  textarea { width: 100%; min-height: 220px; background: #14141c; color: #e8e8ec; border: 1px solid #2a2a38; border-radius: 8px; font-family: monospace; font-size: 12px; padding: 12px; }
  button { background: #e8e8ec; color: #0b0b0f; border: 0; border-radius: 8px; padding: 10px 20px; font-weight: 600; cursor: pointer; margin: 12px 0; }
  button:hover { background: #fff; }
  .result { background: #14141c; border: 1px solid #2a2a38; border-radius: 8px; padding: 16px; margin-top: 12px; white-space: pre-wrap; font-size: 13px; }
  .pass { color: #5fd487; } .fail { color: #e05c5c; } .dim { color: #8888a0; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .ok { background: #12351f; color: #5fd487; } .bad { background: #3d1515; color: #e05c5c; }
</style>
</head>
<body>
<h1>touchstone</h1>
<p class="sub">Paste a signed attestation document. It gets verified locally in your browser — signature, canonical hash, verdict rules, control checks. Nothing leaves the page.</p>
<textarea id="input" placeholder='{"spec":"touchstone/0.1", ...}'></textarea>
<br>
<button onclick="verify()">Verify</button>
<div id="out" class="result" style="display:none"></div>
<script>
async function verify() {
  const raw = document.getElementById('input').value;
  const out = document.getElementById('out');
  out.style.display = 'block';
  try {
    // WASM module — built via wasm-pack; falls back to the JS verifier
    // in /verifiers/js when the wasm bundle isn't compiled yet.
    if (window.touchstone_wasm) {
      const res = JSON.parse(window.touchstone_wasm.verify_attestation_json(raw));
      render(res);
    } else {
      const mod = await import('../verifiers/js/verify.mjs');
      render(await mod.verifyAttestation(raw));
    }
  } catch (e) {
    out.innerHTML = '<span class="fail">error: ' + e + '</span>';
  }
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(r) {
  const out = document.getElementById('out');
  const tag = r.ok ? '<span class="tag ok">VERIFIED</span>' : '<span class="tag bad">FAILED</span>';
  out.innerHTML = tag + '\n\n'
    + 'subject:    ' + esc(r.subject ?? '?') + '\n'
    + 'spec:       ' + esc(r.spec ?? '?') + '\n'
    + 'signature:  ' + (r.signature_valid ? '<span class="pass">valid</span>' : '<span class="fail">invalid</span>') + '\n'
    + 'verdict:    ' + esc(r.verdict ?? '?') + ' ' + (r.verdict_consistent === false ? '<span class="fail">(claimed verdict does not match checks)</span>' : '') + '\n'
    + 'checks:     ' + esc(r.checks ?? '?') + '\n'
    + 'doc hash:   <span class="dim">' + esc(r.doc_hash ?? '?') + '</span>';
}
</script>
</body>
</html>
